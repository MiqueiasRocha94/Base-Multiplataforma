[package]
name = "base-desktop"
version = "0.1.0"
edition = "2021"
description = "Casca desktop (Tauri) do app: empacota o export estático do Next (out/)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"

# Perfil release enxuto (binário pequeno)
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
