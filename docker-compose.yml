# Geracao de APK em container (Capacitor 8). Duas execucoes:
#   1) Atualizar a imagem do toolchain:  docker compose build   (npm run apk:image)
#   2) Gerar o APK usando a imagem:       docker compose run --rm apk   (npm run apk:docker)
#
# O projeto e montado em /workspace. Volumes nomeados so para os caches "append"
# (node_modules, ~/.gradle) — que sao caros e ninguem apaga o diretorio inteiro.
# .next/out/android FICAM no bind mount: sao apagados/recriados pelo build e, se
# fossem volume (mount point), o rmdir daria EBUSY. `node_modules` e volume para
# isolar dos binarios do host Windows (SWC/Turbopack sao por-plataforma).
# APP_ENV: homolog (default) | production | debug.
#
# Servico `web` (build/deploy da app web): imagem auto-contida (multi-stage,
# output standalone) que serve a app Next.js. Ao contrario do `apk`, NAO monta o
# projeto — tudo e copiado e buildado na imagem.
#   docker compose build web           (npm run web:image)
#   docker compose up web              (npm run web:up  -> http://localhost:3000)
# APP_ENV do build web: production (default) | homolog.
name: multiplataforma-base

services:
  apk:
    build:
      context: ./docker
      dockerfile: android.Dockerfile
    image: capacitor-android-toolchain:latest
    working_dir: /workspace
    environment:
      APP_ENV: ${APP_ENV:-homolog}
    command: ["node", "scripts/docker-apk.mjs"]
    volumes:
      - ./:/workspace
      - node_modules:/workspace/node_modules
      - gradle-cache:/root/.gradle

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        APP_ENV: ${APP_ENV:-production}
    image: multiplataforma-web:latest
    environment:
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  node_modules:
  gradle-cache:
